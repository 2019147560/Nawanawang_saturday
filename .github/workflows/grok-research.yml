name: Weekly Grok Research

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      topic:
        description: "Research topic number, e.g. 5-5"
        required: true
        default: "5-5"

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    env:
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      XAI_MODEL: grok-4.6
      TOPIC: ${{ github.event_name == 'workflow_dispatch' && inputs.topic || '5-5' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Grok research
        run: python scripts/grok_research.py "$TOPIC"

      - name: Upload research result
        uses: actions/upload-artifact@v4
        with:
          name: grok-research-results
          path: results/
          if-no-files-found: error
